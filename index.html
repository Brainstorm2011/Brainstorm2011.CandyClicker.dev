<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Candy Clicker</title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="topInfoBoard">
            <div class="candyCpsSegment">
                <div class="candyDisplay">
                    <h1 id="candyDisplay">Candy: 0</h1>
                </div>
                <div class="cpsDisplay">
                    <h2 id="cpsDisplay">CPS: 0</h2>
                </div>
            </div>
            <div class="clickPowerDisplay">
                <h2 id="clickPowerDisplay"></h2>
            </div>
        </div>
        <div class="bodyHolder">
            <img src="Candy.svg" id="candy" class="candy">
            <div class="upgradesHolder">
                <img src="Bronze Cursor.svg" id="bronzeCursor" class="upgrade">
                <img src="Auto Candy.svg" id="autoCandy" class="upgrade">
                <img src="Candy Farm.svg" id="candyFarm" class="upgrade">
                <img src="Candy Mine.svg" id="candyMine" class="upgrade">
                <img src="Silver Cursor.svg" id="silverCursor" class="upgrade">
                <img src="Candy Factory.svg" id="candyFactory" class="upgrade">
                <img src="Candy Lab.svg" id="candyLab" class="upgrade">
                <img src="Candy Temple.svg" id="candyTemple" class="upgrade">
                <img src="Gold Cursor.svg" id="goldCursor" class="upgrade">
                <img src="Candy Rocket.svg" id="candyRocket" class="upgrade">
                <img src="Candy Man.svg" id="candyMan" class="upgrade">
                <img src="Candy King.svg" id="candyKing" class="upgrade">
                <img src="Jade Cursor.svg" id="jadeCursor" class="upgrade">
                <img src="Candy Planet.svg" id="candyPlanet" class="upgrade">
                <img src="Candy Star.svg" id="candyStar" class="upgrade">
                <img src="Candy System.svg" id="candySystem" class="upgrade">
            </div>
        </div>
        <div class="miscellaneousHolder">
            <button class="reset" id="reset">Reset</button>
        </div>
    </body>
</html>
